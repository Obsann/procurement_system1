components:
  schemas:
    ActionEnum:
      enum:
      - APPROVE
      - REJECT
      - RETURN
      type: string
      description: |-
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `RETURN` - Return
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          format: uuid
        approver:
          type: string
          format: uuid
          readOnly: true
        approver_name:
          type: string
          readOnly: true
        role:
          type: string
          maxLength: 50
        action:
          $ref: '#/components/schemas/ActionEnum'
        comment:
          type: string
        previous_status:
          type: string
          readOnly: true
        new_status:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - approver
      - approver_name
      - created_at
      - entity_id
      - entity_type
      - id
      - new_status
      - previous_status
      - role
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 50
        entity_id:
          type: string
          format: uuid
        old_status:
          type: string
          nullable: true
          maxLength: 30
        new_status:
          type: string
          nullable: true
          maxLength: 30
        comment:
          type: string
        ip_address:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        extra_data:
          nullable: true
      required:
      - action
      - entity_id
      - entity_type
      - id
      - timestamp
      - user_name
    Bid:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rfq:
          type: string
          format: uuid
        supplier:
          type: string
          format: uuid
        supplier_name:
          type: string
          readOnly: true
        bid_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
          nullable: true
        lead_time_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        freight_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        insurance_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        is_winner:
          type: boolean
          readOnly: true
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BidLine'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/BidAttachment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachments
      - bid_date
      - created_at
      - grand_total
      - id
      - is_winner
      - rfq
      - supplier
      - supplier_name
    BidAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
        file_name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - file
      - file_name
      - id
    BidLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        quantity_offered:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
        bid:
          type: string
          format: uuid
        rfq_line:
          type: string
          format: uuid
          nullable: true
      required:
      - bid
      - created_at
      - id
      - quantity_offered
      - total_price
      - unit_price
      - updated_at
    DecisionEnum:
      enum:
      - APPROVED
      - RETURNED
      type: string
      description: |-
        * `APPROVED` - Approved
        * `RETURNED` - Returned
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
        is_active:
