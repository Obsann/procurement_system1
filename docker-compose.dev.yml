version: '3.8'

services:
  backend:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    
  frontend:
    command: npm run dev -- --host
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
